- target: $.paths['/api/v1/series/'].get
  update:
    x-mcp-tool: list_series
- target: $.paths['/api/v1/series/{slug}/'].get
  update:
    x-mcp-tool: get_series
- target: $.paths['/api/v1/themes/'].get
  update:
    x-mcp-tool: list_themes
- target: $.paths['/api/v1/features/'].get
  update:
    x-mcp-tool: list_features
- target: $.paths['/api/v1/demand/'].get
  update:
    x-mcp-tool: get_demand_cut
- target: $.paths['/api/v1/news/'].get
  update:
    x-mcp-tool: list_news
- target: $.paths['/api/v1/jobs/'].get
  update:
    x-mcp-tool: list_jobs
- target: $.paths['/api/v1/regulators/'].get
