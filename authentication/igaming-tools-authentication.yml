spec: openapi/igaming-tools-openapi.json
summary:
  types:
  - apiKey
  api_key_in:
  - header
  oauth2: false
  openid_connect: false
  mutual_tls: false
  self_service_signup: true
  note: >-
    One scheme, applied to every operation in the spec. The MCP server at
    mcp.i-gaming.tools is a SEPARATE surface with no authentication at all — probed
