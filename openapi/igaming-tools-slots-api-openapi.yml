openapi: 3.2.0
info:
  title: iGaming Tools Slots API
  version: 1.0.0
  description: 'Public REST API for iGaming data: slot providers, slots, news, jobs, sources.'
  termsOfService: https://i-gaming.tools/terms/
  contact:
    name: iGaming Tools support
    email: support@i-gaming.tools
    url: https://i-gaming.tools/docs/
  license:
    name: Terms of Service
    url: https://i-gaming.tools/terms/
servers:
- url: https://i-gaming.tools
tags:
- name: Slots
paths:
  /api/v1/slots/:
    get:
      operationId: slots_list
      description: 'Cursor-paginated list of published slots. Default order: -created_at. With ?updated_since: order switches to (updated_at, id) ASC for forward-sync. With ?ordering=-release_date|release_date: order switches to release-date mode. With ?ordering=-captured_at|captured_at: order switches to capture-date mode (matches the public listing default order). Use /slots/ids/ for tombstone reconcile (removed slots do not appear in deltas). ETag/304 support via If-None-Match.'
      summary: List public slots
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: Opaque ETag value from a previous response to this same endpoint. When it matches the current ETag, the server returns 304 Not Modified with no body instead of re-sending the full payload.
      - name: cursor
        required: false
        in: query
        description: Opaque pagination cursor from a previous response's next/previous link.
        schema:
          type: string
      - in: query
        name: feature
        schema:
          type: string
        description: Feature slug (exact match). A slot may carry several features.
      - in: query
        name: game_category
        schema:
          type: string
          enum:
          - crash
          - instant_win
          - live
          - other
          - scratch
          - table
          - unknown
          - video_slot
        description: Game category, exact match. 400 on any value outside the enum. Also filters GET /api/v1/demand/, where it doubles as a cut axis (?by=game_category).
      - in: query
        name: has_bonus_buy
        schema:
          type: string
        description: '''true'' or ''false''. Any other value returns 400.'
      - in: query
        name: jackpot_type
        schema:
          type: string
          enum:
          - fixed
          - none
          - pooled
          - progressive
          - unknown
        description: Jackpot type (none/fixed/progressive/pooled/unknown)
      - in: query
        name: max_win_max
        schema:
          type: integer
        description: max_win <= this value (multiplier of stake, positive integer). Also filters GET /api/v1/demand/ — same catalogue filter.
      - in: query
        name: max_win_min
        schema:
          type: integer
        description: max_win >= this value (multiplier of stake, positive integer). Also filters GET /api/v1/demand/ — same catalogue filter.
      - in: query
        name: mechanic
        schema:
          type: string
          enum:
          - cluster
          - lines
          - megaways
          - scatter_pays
          - variable_ways
          - ways
        description: Bet mechanic (lines/ways/cluster/megaways/scatter_pays)
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -captured_at
          - -release_date
          - captured_at
          - release_date
        description: 'Whitelist: ''-release_date'' (newest first) or ''release_date'' (oldest first). Slots with release_date IS NULL sort to the end for ''-release_date'' and to the start for ''release_date''. ''-captured_at'' (most recently captured from a live demo first) or ''captured_at'' (oldest/never-captured first) — matches the public listing''s default order. Any other value → 400. Ignored when ?updated_since is present (sync order wins). Note on backward paging: cursor position is derived from the sort field alone, so walking back with `previous` through the trailing block of items that share the same sort value (those with no release date, or never captured) can skip entries. Forward paging with `next` is always complete, and neither ?updated_since sync nor the /ids/ reconcile is affected. Walk forward when you need the full set.'
      - name: page_size
        required: false
        in: query
        description: Number of results per page. Default 20, maximum 100 — same limits as the rest of the public API. An operator-configured limit may lower the maximum.
        schema:
          type: integer
      - in: query
        name: provider
        schema:
          type: string
        description: Provider slug (exact match).
      - in: query
        name: released_after
        schema:
          type: string
          format: date
        description: ISO date (YYYY-MM-DD). release_date >= this value. Slots with release_date IS NULL are excluded. 400 on invalid format.
      - in: query
        name: released_before
        schema:
          type: string
          format: date
        description: ISO date (YYYY-MM-DD). release_date <= this value — INCLUSIVE, the named day is part of the range. Note that ?published_before, ?posted_before and ?established_before on other endpoints are EXCLUSIVE. Slots with release_date IS NULL are excluded. 400 on invalid format.
      - in: query
        name: rtp_max
        schema:
          type: number
          format: double
        description: rtp_default <= this value (percent, decimal, e.g. 96.5). Also filters GET /api/v1/demand/ — same catalogue filter.
      - in: query
        name: rtp_min
        schema:
          type: number
          format: double
        description: rtp_default >= this value (percent, decimal, e.g. 96.5). Also filters GET /api/v1/demand/ — same catalogue filter.
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive substring search over slot name + aliases. Empty/whitespace-only value is a no-op (does not narrow results). Soft-clipped to 100 characters (not a 400).
      - in: query
        name: series
        schema:
          type: string
        description: Series slug (exact match). A slot belongs to at most one series.
      - in: query
        name: theme
        schema:
          type: string
        description: Theme slug (exact match). A slot may carry several themes.
      - in: query
        name: updated_since
        schema:
          type: string
          format: date-time
        description: 'ISO-8601 datetime. Returns only slots whose content changed at or after this moment. When present, results are ordered by (updated_at, id) ASC — forward through time. Without this param the default order (-created_at, -id) is preserved. 400 on invalid format. Known limitation: cross-object renames (provider/studio/series name changes) do NOT appear in this delta — use /slots/ids/ for tombstone reconcile.'
      - in: query
        name: volatility
        schema:
          type: string
          enum:
          - high
          - low
          - med_high
          - med_low
          - medium
          - very_high
        description: Volatility (low/med_low/medium/med_high/high/very_high)
      tags:
      - Slots
      security:
      - TokenAuth: []
      responses:
        '200':
          headers:
            X-Sync-Timestamp:
              $ref: '#/components/headers/XSyncTimestamp'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Quota-Free-Remaining:
              $ref: '#/components/headers/XQuotaFreeRemaining'
            X-Quota-Paid-Balance:
              $ref: '#/components/headers/XQuotaPaidBalance'
            X-Quota-Resets-At:
              $ref: '#/components/headers/XQuotaResetsAt'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSlotListItemList'
              examples:
                IncrementalSyncWithUpdatedSince:
                  value:
                    next: https://i-gaming.tools/api/v1/slots/?cursor=cD00ODY%3D
                    previous: https://i-gaming.tools/api/v1/slots/?cursor=cj0xJnA9NDg3
                    results:
                    - slug: example-slot-title
                      name: Example Slot Title
                      provider:
                        slug: example-provider
                        name: Example Provider
                      game_category: video_slot
                      game_subtype: null
                      rtp_default: '96.50'
                      volatility: high
                      max_win: 5000
                      mechanic: ways
                      mechanic_value: 243
                      release_date: '2026-01-15'
                      release_date_precision: day
                      thumbnail_url: https://cdn.i-gaming.tools/slots/example-slot-title.webp
                      thumbnail:
                        url: https://cdn.i-gaming.tools/slots/example-slot-title.webp
                        key: slots/example-slot-title.webp
                        version: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                      volume_12m: 12000
                      trend: growing
                      demo_url: null
                      updated_at: '2026-08-01T09:30:00Z'
                  summary: Incremental sync with updated_since
                  description: Pass X-Sync-Timestamp from a previous response as ?updated_since= to receive only slots modified since that moment.
          description: Success.
        '304':
          headers:
            X-Sync-Timestamp:
              $ref: '#/components/headers/XSyncTimestamp'
            ETag:
              $ref: '#/components/headers/ETag'
          description: Not Modified — the ETag in If-None-Match matched the current value. No body.
        '401':
          $ref: '#/components/responses/Err401'
        '429':
          $ref: '#/components/responses/Err429'
        '402':
          $ref: '#/components/responses/Err402'
        '400':
          $ref: '#/components/responses/Err400'
  /api/v1/slots/{slug}/:
    get:
      operationId: slots_retrieve
      description: 'Full slot profile: data (RTP/volatility/layout/mechanics), spec_sheet (symbols/modes/palette/accessibility), assets (screenshots/icon). ETag/304: pass If-None-Match to skip the heavy response on unchanged content.'
      summary: Get slot detail
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: Opaque ETag value from a previous response to this same endpoint. When it matches the current ETag, the server returns 304 Not Modified with no body instead of re-sending the full payload.
      - in: path
        name: slug
        schema:
          type: string
        description: URL-friendly unique identifier of the slot.
        required: true
      tags:
      - Slots
      security:
      - TokenAuth: []
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Quota-Free-Remaining:
              $ref: '#/components/headers/XQuotaFreeRemaining'
            X-Quota-Paid-Balance:
              $ref: '#/components/headers/XQuotaPaidBalance'
            X-Quota-Resets-At:
              $ref: '#/components/headers/XQuotaResetsAt'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDetail'
              examples:
                SlotDetail:
                  value:
                    data:
                      slug: example-slot-title
                      name: Example Slot Title
                      provider:
                        slug: example-provider
                        name: Example Provider
                      game_category: video_slot
                      rtp_default: '96.50'
                      volatility: high
                      max_win: 5000
                      mechanic: ways
                      mechanic_value: 243
                      reels: 5
                      rows: 3
                      release_date: '2026-01-15'
                      release_date_precision: day
                      status: active
                      studio: null
                      series: null
                      order_in_series: null
                      licensed_brand: null
                      rtp_variants:
                      - rtp: '96.50'
                        variant: default
                        condition_note: ''
                        is_default: true
                      min_bet: '0.20'
                      max_bet: '100.00'
                      currency: EUR
                      payline_direction: ltr
                      jackpot_type: none
