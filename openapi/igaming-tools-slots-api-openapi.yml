                        is_default: true
                      has_autoplay: 'yes'
                      mobile_adapted: 'yes'
                      ante_bet_cost: null
                      themes:
                      - slug: fishing
                        name: Fishing
                      features:
                      - slug: free-spins
                        name: Free spins
                      aliases: []
                      provider_ref: ''
                      symbols: []
