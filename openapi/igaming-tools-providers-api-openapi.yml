          - name
          readOnly: true
        game_category:
          type: string
        game_subtype:
          type:
          - string
          - 'null'
        rtp_default:
          type:
          - string
          - 'null'
          description: Decimal → str|null.
          readOnly: true
        volatility:
          type:
          - string
          - 'null'
        max_win:
          type:
          - integer
          - 'null'
        mechanic:
          type:
          - string
          - 'null'
        mechanic_value:
          type:
          - integer
          - 'null'
        release_date:
          type:
          - string
          - 'null'
          format: date
        release_date_precision:
          type: string
        thumbnail_url:
          type:
          - string
          - 'null'
          description: 'CDN-URL of the first screenshot of type logo or preview.


            Logo wins when both are present.'
          readOnly: true
        thumbnail:
          type:
          - object
          - 'null'
          description: Asset-versioned thumbnail object {url, key, version} or null.
          properties:
            url:
              type: string
              format: uri
            key:
              type: string
              description: Storage key — the public path component of the URL.
            version:
              type:
              - string
              - 'null'
              description: SHA-256 checksum of the image.
          readOnly: true
        volume_12m:
          type:
          - integer
          - 'null'
          readOnly: true
        trend:
          allOf:
          - $ref: '#/components/schemas/TrendEnum'
          readOnly: true
        demo_url:
          type:
          - string
          - 'null'
          format: uri
          description: Demo-embed URL (same format as detail assets.demo.embed_url) or null.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: When this record last changed on our side. This is the field ?updated_since= filters and orders by.
      required:
      - demo_url
      - game_category
      - game_subtype
      - max_win
      - mechanic
      - mechanic_value
      - name
      - provider
      - release_date
      - release_date_precision
      - rtp_default
      - slug
      - thumbnail
      - thumbnail_url
      - trend
      - updated_at
      - volatility
      - volume_12m
    RemoteModeEnum:
      enum:
      - on_site
      - hybrid
      - remote
      type: string
      description: '* `on_site` - On-site

        * `hybrid` - Hybrid

        * `remote` - Remote

        * `` - Unknown'
    NewsArticleShort:
      type: object
