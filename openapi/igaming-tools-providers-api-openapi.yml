          - string
          - 'null'
          description: Brand kind code string.
          readOnly: true
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        tagline:
          type: string
          default: ''
        about_html:
          type: string
          description: Sanitized provider bio (HTML). Never raw text.
          readOnly: true
