    ProviderDetail:
      type: object
      description: Full slot provider profile. Includes firmographics, assets (logo), company block (hq/offices/licenses/contacts), counts (slots/jobs/news/team/has_demand), and HATEOAS sub-resource links. about is sanitized HTML, never raw text.
      properties:
        slug:
          type: string
        kind:
