          - country
          - established
          - jurisdiction
          - statutory_authority
          readOnly: true
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type: string
          format: date-time
        assets:
          type: object
          description: Provider assets. logo is null when none is on file or storage is unavailable.
          properties:
            logo:
              type:
              - object
              - 'null'
              properties:
                url:
                  type: string
                  format: uri
                key:
                  type: string
                version:
                  type: string
              required:
              - key
              - url
              - version
          required:
          - logo
          readOnly: true
        company:
          type: object
          description: 'Company block: headquarters, offices, licences and public contacts.'
          properties:
            hq:
              type:
              - object
              - 'null'
              properties:
                label:
                  type: string
                city:
                  type: string
                country:
                  type: string
            offices:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  city:
                    type: string
                  country:
                    type: string
                  sort_order:
                    type: integer
            licenses:
              type: array
              items:
                type: object
                properties:
                  authority:
                    type: string
                  license_ref:
                    type: string
                  jurisdiction:
                    type: string
                  status:
                    type: string
                  sort_order:
                    type: integer
            contacts:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                  label:
                    type: string
                  value:
                    type: string
                required:
                - kind
                - label
                - value
          required:
          - contacts
          - hq
          - licenses
          - offices
          readOnly: true
        counts:
          type: object
          description: How much of each sub-resource this provider has.
          properties:
            slots:
              type: integer
            jobs:
              type: integer
            news:
              type: integer
            team:
              type: integer
            has_demand:
              type: boolean
