          items:
            type: object
            properties:
              host:
                type: string
              display_name:
                type: string
            required:
            - host
            - display_name
          readOnly: true
        links:
          type: object
          description: Relative URLs of this provider's sub-resources. Follow these rather than building paths by hand.
          properties:
            slots:
              type: string
              example: /api/v1/providers/example-provider/slots/
            demand:
              type: string
              example: /api/v1/providers/example-provider/demand/
            jobs:
              type: string
              example: /api/v1/providers/example-provider/jobs/
            news:
              type: string
              example: /api/v1/providers/example-provider/news/
            team:
              type: string
              example: /api/v1/providers/example-provider/team/
          required:
          - slots
          - demand
          - jobs
          - news
          - team
          readOnly: true
