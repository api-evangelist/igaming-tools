          type: string
        company_name:
          type: string
        company:
          type:
          - object
          - 'null'
          properties:
            slug:
              type: string
            canonical_name:
              type: string
            country:
              type: string
          readOnly: true
        location_country:
          type: string
        location_city:
          type: string
        city:
          type:
          - object
          - 'null'
          properties:
            slug:
              type: string
            canonical_name:
              type: string
            country:
