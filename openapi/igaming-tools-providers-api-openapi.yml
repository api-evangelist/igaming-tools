          format: date-time
        status_public:
          allOf:
          - $ref: '#/components/schemas/StatusPublicEnum'
          readOnly: true
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        closed_reason:
          allOf:
          - $ref: '#/components/schemas/ClosedReasonEnum'
          readOnly: true
        apply_url:
          type:
