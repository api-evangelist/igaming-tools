      - casino
      - poker
      - lottery
      - esports
      - affiliate
      - platform_provider
      - game_studio
      - regulator
      - payment_provider
      type: string
      description: '* `sportsbook` - Sportsbook

        * `casino` - Casino

        * `poker` - Poker

        * `lottery` - Lottery

        * `esports` - Esports

        * `affiliate` - Affiliate

        * `platform_provider` - Platform Provider

        * `game_studio` - Game Studio

        * `regulator` - Regulator

        * `payment_provider` - Payment Provider

        * `` - Unknown'
    SalaryPeriodEnum:
      enum:
