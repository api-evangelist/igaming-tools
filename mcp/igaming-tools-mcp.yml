tools:
- name: search_providers
  description: Search/list iGaming slot providers (casino game studios).
  parameters: [query, has_news, country, established_after, established_before, cursor, page_size]
- name: get_provider
  description: 'Get full provider profile: firmographics, licensing, offices, counts, HATEOAS links.'
  parameters: [slug]
- name: list_provider_slots
  description: List slots made by a specific provider, with structural filters.
  parameters: [slug, volatility, mechanic, jackpot_type, has_bonus_buy, theme, feature, cursor, page_size]
- name: get_provider_demand
  description: 'Get demand/popularity snapshot for a provider: computed_at, metrics, top_slots.'
  parameters: [slug]
- name: search_slots
  description: Search and list public slots by RTP, volatility, mechanic, jackpot tier, bonus buy, theme, feature, series and release window.
  parameters: [volatility, mechanic, jackpot_type, has_bonus_buy, provider, theme, feature, series, search, released_after, released_before, rtp_min, rtp_max, game_category, max_win_min, max_win_max, ordering, cursor, page_size]
- name: get_slot
  description: 'Get full slot profile: data (RTP/volatility/mechanics), spec_sheet, assets.'
  parameters: [slug]
- name: get_slot_demand
  description: 'Get per-slot search demand: aggregate plus a Country x Month matrix.'
  parameters: [slug]
- name: list_series
  description: List slot series (game families, e.g. Big Bass, Wolf Gold).
  parameters: [provider, cursor, page_size]
- name: get_series
  description: Get a slot series (game family) summary plus a short roster.
  parameters: [slug]
- name: list_themes
  description: List slot themes with slugs and alternative spellings.
  parameters: [cursor, page_size]
- name: list_features
  description: List slot features (gameplay mechanics) with slugs and alternative spellings.
  parameters: [cursor, page_size]
- name: get_demand_cut
  description: 'Demand cut: which slots are searched in a given market, ranked by 12-month volume.'
  parameters: [country, by, ordering, volatility, mechanic, jackpot_type, has_bonus_buy, provider, theme, feature, search, released_after, released_before, rtp_min, rtp_max, game_category, cursor, page_size]
- name: list_news
  description: List iGaming industry news articles.
  parameters: [brand_slug, brand_kind, host, language, published_after, published_before, cursor, page_size]
- name: list_jobs
  description: List iGaming job vacancies.
  parameters: [igaming_segment, country, remote_mode, employment_type, seniority, company, city, q, posted_after, posted_before, include_closed, source, cursor, page_size]
- name: list_regulators
  description: Search/list iGaming regulators (UKGC, MGA, GGL, ANJ, etc.).
  parameters: [query, country, cursor, page_size]
- name: get_regulator
  description: 'Get full regulator profile: jurisdiction, authority_for, statutory_authority, hosts.'
  parameters: [slug]
- name: list_sources
  description: List active news-parsing sources (hosts) with brand attribution.
  parameters: [cursor, page_size]
tool_count: 17
