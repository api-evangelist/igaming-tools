x-evidence:
  fetched: '2026-08-30'
  reverified: '2026-09-05'
  url: https://mcp.i-gaming.tools/mcp
  http_status: 200
  content_type: text/event-stream
  session_header: mcp-session-id
  note: >-
    A bare tools/list without the initialize handshake returns HTTP 400. That is correct
    MCP protocol, not a broken server — the session id issued by initialize must be sent
    back as the mcp-session-id header. resources/list and prompts/list both returned
    empty arrays, so the server advertises those capabilities but ships none today.
  raw: mcp/igaming-tools-mcp-tools.json
