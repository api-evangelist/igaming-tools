name: iGaming Tools MCP Server
description: >-
  Free, public, unauthenticated hosted MCP server exposing the iGaming Tools catalog
  (slot providers, slots, series, themes, features, search demand, regulators, industry
  news, jobs and news sources) as 17 read-only tools over Streamable HTTP. Probed live:
  initialize -> notifications/initialized -> tools/list returned all 17 tool definitions
  with full inputSchema, with no credential of any kind.
