name: iGaming Tools API lifecycle
description: >-
  Versioning, deprecation, status and support posture, established by reading the
  published docs and probing the conventional locations. The API is young and small and
  the lifecycle surface reflects that: a URI-versioned v1 with no deprecation policy,
  no status page and no changelog.
versioning:
  scheme: uri-path
  current_version: v1
  spec_version: 1.0.0
  path_prefix: /api/v1/
  policy_published: false
  note: >-
    A version is pinned in the path and in info.version, but no written policy states how
    long v1 is supported, how a v2 would be introduced, or what constitutes a breaking
    change. There is one soft forward-compatibility rule in the conventions guide: "Fields
    absent from the response schema are not supported in the current version."
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No RFC 8594 Sunset or Deprecation header is declared anywhere in the OpenAPI, and no
    operation carries `deprecated: true`. No deprecation or end-of-life policy page was
    found. Probed https://i-gaming.tools/changelog/ (404).
