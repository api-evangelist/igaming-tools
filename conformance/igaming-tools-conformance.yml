name: iGaming Tools standards conformance
description: >-
  Cross-cutting and domain standards asserted against the published OpenAPI 3.0.3 contract
  and the provider's own guides. Every `conforms: true` below points at a location in the
  contract or a provider statement; every `conforms: false` is an observed absence, not an
  assumption.
standards:
- id: openapi
  name: OpenAPI Specification
  version: 3.0.3
  conforms: true
  evidence: >-
    Two byte-identical documents served at https://i-gaming.tools/docs/openapi.json
    (application/json) and https://i-gaming.tools/api/schema/?format=json
    (application/vnd.oai.openapi+json). 29 operations, 59 component schemas, 9 reusable
    error responses, 6 reusable headers, operationId + summary + description + tags +
    examples on every operation.
- id: http-conditional-requests
  name: HTTP conditional requests (RFC 9110 ETag / If-None-Match)
  conforms: true
  evidence: >-
    ETag response header and If-None-Match request header declared as reusable components
    and wired into every list and detail operation, with a documented 304 response.
- id: retry-after
  name: Retry-After (RFC 9110)
  conforms: true
  evidence: components.headers.RetryAfter, referenced from the Err429 / Err429WithQuota responses.
- id: pagination
  name: Cursor pagination
  conforms: true
  evidence: >-
    All list operations return {next, previous, results} with an opaque `cursor` parameter
    and no OFFSET, documented at https://i-gaming.tools/docs/conventions/.
- id: rfc9457
  name: RFC 9457 Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    Errors use a bespoke flat {detail, code} JSON envelope served as application/json.
    No application/problem+json media type, and no type/title/status/instance members,
    appear anywhere in the contract.
- id: rfc9331
  name: RateLimit header fields (RFC 9331 / draft-ietf-httpapi-ratelimit-headers)
  conforms: false
  evidence: >-
    No RateLimit-* or X-RateLimit-* headers are declared. Runtime budget is signaled
    through vendor headers X-Quota-Free-Remaining / X-Quota-Paid-Balance /
    X-Quota-Resets-At instead.
- id: rfc8594
  name: RFC 8594 Sunset header
  conforms: false
  evidence: No Sunset or Deprecation header is declared and no operation is marked deprecated.
- id: idempotency
  name: Idempotency keys
  conforms: false
  applicable: false
  evidence: >-
    Not applicable — all 29 operations are GET, which is idempotent by HTTP definition.
    There is no unsafe method in the contract for an idempotency key to protect.
- id: oauth2
  name: OAuth 2.0
  conforms: false
