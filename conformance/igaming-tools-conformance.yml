domain_standard:
  market: iGaming / online-casino data
  standard_declared: false
  evidence: >-
    REWARD-ONLY CHECK, HONESTLY EMPTY. Nothing in the contract declares a domain standard:
    no SCIM URN, no OData $metadata, no OpenRTB endpoint, no HL7/X12/ISO-20022 message
    type, no OAI-PMH verb, no LTI/OneRoster shape. The iGaming market's own technical
    standards (GLI-19/GLI-33 test standards, operator-side wallet and RGS integration
    specs) govern game servers and operator platforms, not third-party catalog data, so
    there is no applicable published standard for this product shape to conform to.
    Recorded as absent rather than substituted with something adjacent.
  note: >-
    Regulators are DATA in this API (list_regulators returns UKGC, MGA, GGL, ANJ and
    others), which is not the same thing as the contract conforming to a regulatory
    standard. The distinction is deliberate.
compliance_certifications:
  published: false
  probed:
  - url: https://i-gaming.tools/.well-known/security.txt
    status: 404
  - url: https://i-gaming.tools/terms/
    status: 200
  note: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP claim appears on the site, and no trust
    center exists. probe-security-programs.py returned vdp=none trust=none. The provider
    handles no player funds or PII of gamblers — it documents publicly-released games — so
    the absence is consistent with the product.
defects_observed:
- id: llms-txt-dead-links
  severity: medium
  detail: >-
    https://i-gaming.tools/llms.txt advertises /docs/providers.md and /docs/slots.md as
    Markdown API references. Both return 404. The docs-level llms.txt lists the correct
    HTML paths (/docs/providers/, /docs/slots/) which do return 200, so the site-level
    llms.txt is stale. An agent following the root llms.txt hits two dead ends.
  evidence:
  - url: https://i-gaming.tools/docs/providers.md
    status: 404
  - url: https://i-gaming.tools/docs/slots.md
    status: 404
  - url: https://i-gaming.tools/docs/providers/
    status: 200
- id: error-envelope-disagreement
  severity: medium
  detail: >-
    The OpenAPI declares a flat {detail, code} error body on all nine Err* components;
    /docs/errors.md documents a nested {"error": {code, message, detail}} body. The two
    cannot both be right.
- id: dead-footer-links
  severity: low
  detail: The site footer links /support/ and /corrections/; both return 404.
  evidence:
  - url: https://i-gaming.tools/support/
    status: 404
  - url: https://i-gaming.tools/corrections/
    status: 404
- id: dead-github-org
  severity: low
  detail: >-
    The site footer links https://github.com/igamingtools, which returns 404 — the org does
    not exist. No GitHubOrganization pointer was emitted for this provider as a result.
  evidence:
  - url: https://github.com/igamingtools
    status: 404
