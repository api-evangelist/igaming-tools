name: iGaming Tools
aid: igaming-tools
description: iGaming Tools (i-gaming.tools) is an independent data provider that documents online casino slot games and the
  industry around them. Its own automated pipeline drives headless browsers against live provider demos to extract 45+ structured
  fields per slot — RTP and up to 30 variants, volatility, max win, reels, bet mechanic, full paytables with per-symbol payouts
  and hex colours, bonus rounds, and ~21 screenshots with WebP derivatives — alongside slot providers, game series, themes,
  features, licensing regulators, ingested industry news, iGaming job vacancies and a computed search-demand layer. Access
  is a token-authenticated, read-only REST API (OpenAPI 3.0.3, 29 GET operations, cursor pagination, ETag/304, ?updated_since
  incremental sync with tombstone reconcile) plus a free unauthenticated hosted MCP server exposing 17 read-only tools, and
  two llms.txt files. It is not a casino, operator or betting service.
