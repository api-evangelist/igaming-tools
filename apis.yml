  description: >-
    Free public hosted MCP server (Streamable HTTP, no API key, read-only, not metered) exposing the same
    iGaming dataset as 17 tools: provider search and profiles, slot search and full spec sheets, series,
    themes, features, per-slot and per-provider search demand, market demand cuts, regulators, industry
    news, jobs and news sources. Live handshake on 2026-08-30 returned protocolVersion 2025-06-18 and
    serverInfo iGaming Tools MCP 3.4.7. Documented for Claude, ChatGPT, Cursor, VS Code/Copilot, Claude
