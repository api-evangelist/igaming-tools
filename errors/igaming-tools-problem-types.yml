  code: unauthorized
  title: Unauthorized
  detail: Authentication credentials were not provided.
  remediation: >-
    Send the header `Authorization: Token <hex>`. The prefix is "Token", not "Bearer".
    Issue a key at /account/.
  quota_decremented: false
  spec_component: Err401
- status: 402
  code: quota_exhausted
  title: Payment Required
  detail: Quota exhausted. Top up or wait until the monthly reset.
  remediation: >-
    Monthly billing quota is depleted. Wait for the 1st-of-month UTC reset, or contact
    support@i-gaming.tools to be provisioned more. Distinct from 429 — do NOT retry with
    backoff; retrying will not help until the quota resets. Read X-Quota-Resets-At.
  quota_decremented: false
  headers: [X-Quota-Free-Remaining, X-Quota-Paid-Balance, X-Quota-Resets-At]
  spec_component: Err402
- status: 403
  code: forbidden
  title: Forbidden
  detail: Authentication credentials were not provided.
  remediation: >-
    This endpoint is served to a signed-in browser session and no valid session was
