disambiguation:
  '402_vs_429': >-
    402 means the monthly BUDGET is gone — retrying is useless until the reset. 429 means
    the per-minute PACE is too fast — retrying after Retry-After will succeed. Conflating
    them is the most likely integration error against this API, and the provider documents
    the distinction in three separate places.
