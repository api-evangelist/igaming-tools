description: >-
  Entity-relationship graph derived from the 59 component schemas and the $ref / id-reference
  fields that connect them, plus the path structure of the 29 operations. Identifiers are
  human-readable slugs for catalog entities (provider, slot, series, theme, feature,
  regulator) and integers for the two ingested feeds (news, jobs); news sources are keyed
  by hostname.
