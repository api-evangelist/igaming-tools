graph_notes:
- >-
  Providers and regulators are the SAME underlying entity type in the contract — both are
  "brands" discriminated by `kind`. That is why regulators_news_list and providers_news_list
  return identically-shaped payloads and share the summary "News for this brand".
- >-
  Demand is a separate computed layer, not a field on the catalog entities. Every demand
  payload carries computed_at, so a consumer can tell how stale the snapshot is.
- >-
  Themes and features are reachable as filters and as directory listings, but a slot's own
  theme/feature membership is not returned as an id array on SlotListItem — resolve it via
  the taxonomy endpoints and filtered queries. Aliases are NOT accepted as filter values;
  look the canonical slug up in list_themes / list_features first.
