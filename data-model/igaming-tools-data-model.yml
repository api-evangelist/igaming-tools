entities:
- name: Provider
  schemas: [BrandShort, BrandFull, ProviderDetail]
  description: A slot game studio or brand. Firmographics, licensing, offices, aliases, hosts, counts and HATEOAS links.
  operations: [providers_list, providers_retrieve, providers_ids_list]
- name: Slot
  schemas: [SlotListItem, SlotDetail]
  description: An individual slot game title with math, mechanics, paytable and assets. SlotDetail nests data / spec_sheet / assets.
  operations: [slots_list, slots_retrieve, slots_ids_list]
- name: Series
  schemas: [SeriesListItem, SeriesDetail, SeriesSlotItem, SeriesDirectoryPage]
  description: A game family (Big Bass, Wolf Gold) grouping slots from one provider.
  operations: [series_list, series_retrieve]
- name: Theme
  schemas: [TaxonomyDirectoryItem, TaxonomyDirectoryPage]
  description: Visual/narrative setting taxonomy term with slug and aliases.
  operations: [themes_list]
- name: Feature
  schemas: [TaxonomyDirectoryItem, TaxonomyDirectoryPage]
  description: Gameplay-mechanic taxonomy term with slug and aliases.
  operations: [features_list]
- name: Regulator
  schemas: [BrandShort, BrandFull]
  description: A licensing authority with jurisdiction, authority_for, statutory_authority and hosts.
  operations: [regulators_list, regulators_retrieve]
- name: NewsArticle
  schemas: [NewsArticleShort, NewsArticleFull]
  description: An ingested industry news article attributed to a brand and a source host.
  operations: [news_list, news_retrieve, news_stats_retrieve]
- name: Job
  schemas: [JobsList, JobsDetail]
  description: An ingested iGaming vacancy with company, location, salary, segment and structured requirements.
  operations: [jobs_list, jobs_retrieve, jobs_stats_retrieve]
- name: Source
  schemas: [Source]
  description: A crawled news host with brand attribution and 30-day article counts.
  operations: [sources_list, sources_retrieve]
- name: SlotDemand
  schemas: [SlotDemand, SlotDemandMarket, SlotCut, SlotCutEnvelope, SlotGlobalCut, SlotGlobalCutEnvelope]
  description: Search-demand snapshot for one slot — 12-month volume, YoY, trend, sparkline, and a Country x Month matrix.
  operations: [slots_demand_retrieve]
- name: ProviderDemand
  schemas: [ProviderDemand, ProviderDemandMetrics, ProviderDemandMarket, ProviderDemandTopSlot]
  description: Search-demand snapshot for one provider plus its top slots.
  operations: [providers_demand_retrieve]
- name: DemandCut
  schemas: [CountryCut, CountryCutEnvelope, KeyCut, KeyCutEnvelope, DemandCutEnvelope, DemandWindow, DemandCoverage]
  description: Market-level demand cut — which slots are searched in a country, ranked by 12-month volume.
  operations: [demand_list]
